[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtsrb-traffic-sign-recognition"
version = "1.0.0"
description = "Production-oriented traffic sign recognition on GTSRB: reproducible training, MLflow tracking, evaluation and a containerised FastAPI inference service."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ishu Rajput" }]
keywords = ["gtsrb", "traffic-sign-recognition", "computer-vision", "pytorch", "mlops", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# Kept deliberately minimal. pandas was a dependency of the original notebook but
# nothing in the refactored code imports it any more - evaluation writes CSV with
# the standard library and the metric tables are lists of dicts - so it was removed
# rather than left in as a 75 MB unused dependency.
dependencies = [
  "numpy>=2.0",
  "pillow>=10.4",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "torch>=2.6",
  "torchvision>=0.21",
]

# PyTorch is resolved from the CPU wheel index rather than PyPI.
#
# On Linux, PyPI's `torch` is the CUDA build: it pulls several gigabytes of NVIDIA
# runtime libraries plus triton. Measured effect on the inference image before this
# was configured: 9.63 GB, of which 3.3 GB was `nvidia` and 817 MB was `triton` -
# GPU runtime for a service that runs on CPU.
#
# This is declared here rather than as a `UV_INDEX_URL` in the Dockerfile because
# the lock file, not the index URL, decides what `uv sync --frozen` installs. A
# build-time index override is silently ignored against a lock that points at PyPI.
# Declaring the source makes the lock itself CPU-only, so local runs, CI and the
# container all resolve identically.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.optional-dependencies]
# Inference API. Kept out of the core install so that training-only
# environments do not pull in a web stack.
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "prometheus-client>=0.21",
]
# Experiment tracking. MLflow is a large dependency, so it is opt-in and the
# training loop degrades gracefully to plain logging when it is absent.
tracking = ["mlflow>=2.17"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pre-commit>=4.0",
]
all = [
  "gtsrb-traffic-sign-recognition[api,tracking,dev]",
]

[project.scripts]
gtsrb-train = "gtsrb.cli.train:main"
gtsrb-evaluate = "gtsrb.cli.evaluate:main"
gtsrb-predict = "gtsrb.cli.predict:main"
gtsrb-serve = "gtsrb.cli.serve:main"

[project.urls]
Repository = "https://github.com/irajput215/GTSRB-Traffic-Sign-Recognition-Deep-Learning-Project-"
Issues = "https://github.com/irajput215/GTSRB-Traffic-Sign-Recognition-Deep-Learning-Project-/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtsrb"]

# ---------------------------------------------------------------------------
# Ruff - linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy", ".venv", "docs/original"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "ARG", # unused arguments
  "PL",  # pylint
  "RUF", # ruff-specific
  "LOG", # logging
  "G",   # logging format
  "T20", # flake8-print (notebooks/scripts may print, so this is scoped below)
]
ignore = [
  "PLR0913", # too many arguments: model/trainer constructors legitimately take many
  "PLR2004", # magic value comparison: common and readable in metric assertions
  "SIM108",  # ternary is not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["PLR2004", "ARG001", "ARG002"]
# CLIs exist to write to stdout; that is the point of them.
"src/gtsrb/cli/*" = ["T20"]
# A no-op tracker must accept the whole interface and ignore all of it.
"src/gtsrb/tracking/base.py" = ["ARG002"]
"src/gtsrb/evaluation/visualization.py" = ["PLR0913"]
"src/gtsrb/api/*" = ["B008"] # FastAPI Depends() in defaults is the documented pattern

[tool.ruff.lint.isort]
known-first-party = ["gtsrb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

# ---------------------------------------------------------------------------
# mypy - static typing. Applied to the library and tests, not to notebooks.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/gtsrb", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "torchvision.*", "mlflow.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "unit: fast, isolated unit tests",
  "integration: tests that wire multiple components together",
  "slow: tests that take more than a few seconds",
]
filterwarnings = [
  "error::DeprecationWarning:gtsrb.*",
]

[tool.coverage.run]
source = ["src/gtsrb"]
branch = true
omit = ["*/__init__.py", "src/gtsrb/cli/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]
