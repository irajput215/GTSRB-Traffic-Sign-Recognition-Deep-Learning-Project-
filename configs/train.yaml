# Training loop, optimiser, schedule, early stopping and checkpointing.
#
# Defaults deliberately reproduce the original COMP9444 protocol (Adam, lr 1e-3,
# weight decay 1e-4, batch 16, 30 epochs, ReduceLROnPlateau on a plateau of 3,
# gradient clipping at 1.0, AMP where available) with two deliberate changes,
# both justified in docs/DECISIONS.md:
#
#   * the checkpoint and early-stopping monitor is val_macro_f1, not
#     val_accuracy. The audit showed accuracy hid a class at 54% recall, so
#     selecting on accuracy selects a model that is not the best one for the
#     long tail.
#   * early stopping is enabled, because the original MLP was still improving at
#     the epoch limit and the original CNN had stopped improving long before it.
training:
  epochs: 30
  batch_size: 16
  seed: 43
  device: auto

  # Deterministic kernels. Turn off for a small throughput gain if exact
  # reproducibility is not needed.
  deterministic: true
  amp: true
  grad_clip_norm: 1.0

  loss: cross_entropy
  label_smoothing: 0.0
  log_every_n_steps: 50

  optimizer:
    name: adam
    lr: 1.0e-3
    weight_decay: 1.0e-4
    momentum: 0.9
    nesterov: false

  scheduler:
    name: reduce_on_plateau
    monitor: val_loss
    factor: 0.5
    patience: 3
    min_lr: 1.0e-6

  early_stopping:
    enabled: true
    monitor: val_macro_f1
    mode: max
    patience: 8
    min_delta: 1.0e-4

  checkpoint:
    directory: artifacts/checkpoints
    filename: best.pt
    monitor: val_macro_f1
    mode: max
    save_last: true

# MLflow is opt-in and points at a local SQLite database by default, so nothing
# here requires a tracking server or network access.
#
# sqlite:/// rather than file:./mlruns because MLflow 3.x put the filesystem
# tracking backend into maintenance mode and refuses it unless
# MLFLOW_ALLOW_FILE_STORE=true is set. Point this at an http:// URI for a remote
# server; keep any credential for that server in your shell, not in this file.
tracking:
  enabled: false
  tracking_uri: sqlite:///mlflow.db
  experiment_name: gtsrb-traffic-sign-recognition
  run_name: null
  tags: {}
  log_model: true
  register_model: false
  registered_model_name: gtsrb-traffic-sign-classifier
  log_artifacts: true

inference:
  checkpoint_path: artifacts/checkpoints/best.pt
  device: auto
  top_k: 5
  max_upload_bytes: 5000000
